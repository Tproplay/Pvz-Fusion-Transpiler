[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PvZRH_node"
version = "0.1.2"
authors = [
    { name = "Tproplay" }
]
description = "A procedural, context-aware visual scripting layout framework for PvZ Fusion modding graphs."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
packages = ["PvZRH_node"]

[tool.setuptools.package-dir]
"PvZRH_node" = "src"
