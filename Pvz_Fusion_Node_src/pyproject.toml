[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PvZ_Fusion_Node"
version = "4.0.0"
authors = [
    { name = "Tproplay" }
]
description = "A procedural, context-aware visual scripting layout framework for PvZ Fusion modding graphs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["F541"]